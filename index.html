<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineGuia - Seu Guia de Filmes</title>
    <!-- Link para ícones (usaremos para a busca e filtros se quiser) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO MINIMALISTA -->
    <header class="header-principal">
        <div class="container-header">
            <h1 class="logo">Cine<span class="destaque">Guia</span></h1>
            
            <div class="controles-header">
                <div class="barra-busca">
                    <i class="fas fa-search"></i>
                    <input type="text" id="campo-busca" placeholder="Buscar filmes, séries ou gêneros...">
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- SEÇÃO HERO (BANNER DE DESTAQUE) - Gerado pelo JS -->
        <section id="hero-destaque" class="hero"></section>

        <!-- SEÇÃO DE FILTROS E GRADE -->
        <section class="container-conteudo">
            <div class="barra-filtros">
                <h2>Explorar Categorias</h2>
                <div id="botoes-filtro" class="filtros-grade">
                    <!-- Botões gerados pelo JS -->
                </div>
            </div>

            <!-- GRADE DE FILMES MODERNA -->
            <div id="catalogo" class="grade-filmes">
                <!-- Cards gerados pelo JS -->
            </div>
        </section>
    </main>

    <!-- JANELA MODAL DE DETALHES -->
    <div id="modal-filme" class="modal escondido">
        <div class="modal-conteudo">
            <button id="fechar-modal" class="btn-fechar">✖</button>
            <div class="modal-layout">
                <img id="modal-capa" src="" alt="Capa do filme">
                <div class="modal-detalhes">
                    <div class="modal-meta">
                        <span id="modal-genero" class="tag-genero"></span>
                        <span id="modal-nota" class="nota-grande"></span>
                    </div>
                    <h2 id="modal-titulo"></h2>
                    <p id="modal-sinopse"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
