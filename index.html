<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineWeekend - Filmes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <h1>CINEWEEKEND</h1>
  <nav>
    <a href="#">Início</a>
    <a href="#catalogo">Catálogo</a>
    <a href="#favoritos">Minha lista</a>
  </nav>
  <input id="pesquisa" type="text" placeholder="Buscar filmes...">
</header>

<section class="banner">
  <div>
    <span>SEU CINEMA EM CASA</span>
    <h2>Prepare a pipoca.<br>Escolha seu filme.</h2>
    <p>Os melhores filmes para assistir no fim de semana.</p>
  </div>
</section>

<main class="layout">
  <section class="catalogo" id="catalogo">
    <h2>Catálogo de filmes</h2>
    <div id="lista-filmes" class="filmes"></div>
  </section>

  <aside class="filtros">
    <h2>Gêneros</h2>
    <div id="lista-generos"></div>
  </aside>
</main>

<div id="modal" class="modal">
  <div class="modal-conteudo">
    <button id="fechar-modal" class="fechar">✕</button>
    <div id="detalhes"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
