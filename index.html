<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Filmes e Séries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍿 Guia do Fim de Semana</h1>
    <p>Clique em um filme para ver a sinopse completa</p>
    <input type="text" id="campo-busca" placeholder="🔍 Buscar filme ou série...">
  </header>

  <!-- O JavaScript vai preencher este espaço -->
  <main id="catalogo"></main>

  <!-- Janela (Modal) que abre ao clicar no filme -->
  <div id="modal-filme" class="modal escondido">
    <div class="modal-conteudo">
      <button id="fechar-modal" class="btn-fechar">✖</button>
      <img id="modal-capa" src="" alt="Capa do filme">
      <div class="modal-detalhes">
        <span id="modal-genero" class="tag-genero"></span>
        <span id="modal-nota" class="nota"></span>
        <h2 id="modal-titulo"></h2>
        <p id="modal-sinopse"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
