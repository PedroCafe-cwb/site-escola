
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWeekend | Filmes para maratonar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 class="logo">CINE<span>WEEKEND</span></h1>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#filmes">Filmes</a>
        <a href="#favoritos">Favoritos</a>
    </nav>

    <input type="text" id="pesquisa" placeholder="Buscar filmes...">
</header>

<section class="banner" id="inicio">
    <div class="banner-content">
        <h2>SEU PRÓXIMO FILME ESTÁ AQUI!</h2>
        <p>Prepare a pipoca e escolha sua próxima maratona.</p>
        <button onclick="carregarPopulares()">Explorar filmes</button>
    </div>
</section>

<main>
    <section id="filmes">
        <h2>🎬 Filmes populares</h2>

        <div class="categorias" id="categorias"></div>

        <div class="filmes" id="listaFilmes">
            Carregando filmes...
        </div>
    </section>

    <section id="favoritos">
        <h2>❤️ Meus favoritos</h2>
        <div class="filmes" id="listaFavoritos"></div>
    </section>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <button class="fechar" onclick="fecharModal()">X</button>
        <div id="detalhes"></div>
    </div>
</div>

<footer>
    <h2>CINEWEEKEND</h2>
    <p>Seu final de semana merece bons filmes!</p>
    <small>Dados de filmes: TMDB</small>
</footer>

<script src="app.js"></script>
</body>
</html>
